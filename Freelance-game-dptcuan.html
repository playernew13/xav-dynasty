<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Freelance Game Cuan — Xav|Dynasty</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family: system-ui, -apple-system, sans-serif;
            background:linear-gradient(135deg,#0f172a,#1e293b,#334155,#1e293b,#0f172a);
            background-size:400% 400%;
            animation: latarBergerak 15s ease infinite;
            min-height:100vh;
            padding:20px 20px 40px;
            color:white;
        }
        @keyframes latarBergerak{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .container{max-width:500px;margin:0 auto;}

        /* === HEADER === */
        .header{text-align:center;margin-bottom:30px;margin-top:10px;}
        .logo{font-size:48px;margin-bottom:10px;animation: naikTurun 3s ease-in-out infinite;}
        @keyframes naikTurun{
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-8px);}
        }
        .judul-utama{
            font-size:26px;font-weight:800;
            background:linear-gradient(90deg,#facc15,#22c55e,#3b82f6,#facc15);
            background-size:300% 100%;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            animation: pelangi 4s linear infinite;
            margin-bottom:6px;
        }
        @keyframes pelangi{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
        .sub-judul{color:#94a3b8;font-size:14px;}

        /* === KARTU GAME === */
        .kartu-game{
            background:rgba(255,255,255,.05);backdrop-filter:blur(20px);
            border-radius:24px;padding:22px;border:1px solid rgba(255,255,255,.1);
            margin-bottom:20px;
            animation: muncul .6s ease-out forwards;opacity:0;transform:translateY(15px);
        }
        @keyframes muncul{to{opacity:1;transform:translateY(0);}}

        .nama-game{font-size:20px;font-weight:800;margin-bottom:4px;}
        .desk-game{font-size:13px;color:#94a3b8;margin-bottom:16px;line-height:1.6;}

        /* === TOMBOL === */
        .baris-tombol{display:flex;gap:10px;}
        .tombol{
            flex:1;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;
            cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:6px;
        }
        .tombol.download{
            background:linear-gradient(90deg,#22c55e,#16a34a);color:white;
            box-shadow:0 4px 15px rgba(34,197,94,.25);
        }
        .tombol.download:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,197,94,.35);}
        .tombol.detail{
            background:rgba(255,255,255,.08);color:#ddd;border:1px solid rgba(255,255,255,.15);
        }
        .tombol.detail:hover{background:rgba(255,255,255,.15);transform:translateY(-2px);}

        /* === KOTAK DETAIL === */
        .kotak-detail{
            margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);
            display:none;animation: turun .4s ease-out forwards;opacity:0;transform:translateY(-10px);
        }
        .kotak-detail.buka{display:block;}
        @keyframes turun{to{opacity:1;transform:translateY(0);}}

        .judul-bagian{
            font-size:15px;font-weight:700;margin:16px 0 10px;
            display:flex;align-items:center;gap:8px;
        }
        .judul-bagian:first-child{margin-top:0;}

        /* === VIDEO === */
        .wadah-video{
            position:relative;width:100%;border-radius:14px;overflow:hidden;
            background:#000;aspect-ratio:16/9;margin:10px 0;
        }
        video{width:100%;height:100%;object-fit:contain;background:#000;}

        /* === KODE UNDANGAN === */
        .kotak-kode{
            display:flex;align-items:center;gap:10px;padding:12px;
            background:rgba(250,204,21,.1);border-radius:10px;border:1px solid rgba(250,204,21,.2);
            margin:10px 0;
        }
        .kode-undangan{flex:1;font-size:20px;font-weight:800;color:#facc15;letter-spacing:2px;}
        .tombol-salin{
            padding:10px 14px;border-radius:8px;border:none;
            background:#facc15;color:#000;font-weight:bold;cursor:pointer;transition:.3s;
        }
        .tombol-salin:hover{transform:scale(1.05);}

        .footer{text-align:center;margin-top:30px;font-size:11px;color:#475569;}
        .tambah-game-note{text-align:center;margin-top:10px;font-size:11px;color:#64748b;}
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">💸</div>
            <h1 class="judul-utama">Freelance Game Cuan</h1>
            <p class="sub-judul">Pilih game di bawa untuk di mainkan</p>
        </div>

        <!-- ============================================== -->
        <!-- ✅ GAME 1 — NO FIGHT (SIAP PAKAI) -->
        <!-- ============================================== -->
        <div class="kartu-game" id="game-1">
            <h3 class="nama-game">No Fight (Tanpa Syarat)</h3>
            <p class="desk-game">1jt+ pemain</p>

            <div class="baris-tombol">
                <button class="tombol download" onclick="bukaDownload(1)">
                    ⬇️ Download
                </button>
                <button class="tombol detail" onclick="toggleDetail(1)">
                    📋 Detail
                </button>
            </div>

            <div class="kotak-detail" id="detail-1">
                <!-- VIDEO CARA PAKAI -->
                <h4 class="judul-bagian">Tutor cara download game</h4>
                <div class="wadah-video">
                    <video controls preload="metadata">
                        <source src="https://cdn.videy.co/ZLxBOhDP1.mp4" type="video/mp4">
                        Video tidak bisa diputar.
                    </video>
                </div>

                <!-- KODE UNDANGAN SAJA -->
                <h4 class="judul-bagian">Kode Undangan Kamu</h4>
                <div class="kotak-kode">
                    <span class="kode-undangan" id="kode-1">33898555</span>
                    <button class="tombol-salin" onclick="salinKode(1)">📋 Salin</button>
                </div>
            </div>
        </div>
        <!-- ============================================== -->
        <!-- ✅ SALIN DARI SINI KE BAWAH BUAT TAMBAH GAME -->
        <!-- ============================================== -->
        <!--
        <div class="kartu-game" id="game-2">
            <h3 class="nama-game">🎮 NAMA GAME KEDUA</h3>
            <p class="desk-game">Tulis deskripsi game di sini</p>

            <div class="baris-tombol">
                <button class="tombol download" onclick="bukaDownload(2)">

                </button>
                <button class="tombol detail" onclick="toggleDetail(2)">
                    📋 Detail

            </div>

            <div class="kotak-detail" id="detail-2">

        <!-- ============================================== -->
        <!-- ✅ AKHIR BLOK SALINAN GAME -->
        <!-- ============================================== -->

        <p class="tambah-game-note">Bagikan web ini ke temen untuk dapat cuan bersama</p>

        <div class="footer">
            © 2026 game resmi playstore
        </div>
    </div>

<script>
    // ==============================================
    // ✅ DATA SEMUA GAME — EDIT DI SINI AJA!
    // ==============================================
    const daftarGame = {
        1: {
            linkDownload: "https://d29hr22rmhs7rs.cloudfront.net/nf/index_1.html?id=33898555",
            kodeUndangan: "33898555"
        }
        // Tambah game lain di sini format:
        // , 2: { linkDownload: "LINK-DOWNLOAD", kodeUndangan: "KODE-ANDA" }
    };

    function bukaDownload(id){
        const game = daftarGame[id];
        if(!game || !game.linkDownload){
            alert("⚠️ Link belum diatur untuk Game " + id);
            return;
        }
        window.open(game.linkDownload, '_blank');
    }

    function toggleDetail(id){
        const detail = document.getElementById('detail-' + id);
        detail.classList.toggle('buka');
    }

    function salinKode(id){
        const game = daftarGame[id];
        const kode = game ? game.kodeUndangan : document.getElementById('kode-' + id).textContent;
        navigator.clipboard.writeText(kode).then(()=>{
            alert("✅ Kode disalin: " + kode);
        }).catch(()=>{
            alert("Salin manual: " + kode);
        });
    }
</script>
</body>
