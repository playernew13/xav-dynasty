<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - QRIS & Manual</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  html, body { min-height:100%; }
  body {
    min-height:100vh;
    display:flex; justify-content:center; align-items:center;
    padding:20px;
    background: url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat fixed;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0;
    background:rgba(0,0,0,.6); z-index:0;
  }
  .blob{
    position:fixed; border-radius:50%; filter:blur(90px);
    opacity:.55; z-index:0; pointer-events:none;
    animation: float 14s ease-in-out infinite;
  }
  .blob.b1{ width:380px; height:380px; background:#6a11cb; top:-100px; left:-100px; animation-delay:0s; }
  .blob.b2{ width:340px; height:340px; background:#2575fc; bottom:-120px; right:-100px; animation-delay:-5s; }
  .blob.b3{ width:300px; height:300px; background:#ff2d95; top:40%; left:60%; animation-delay:-9s; }
  @keyframes float{
    0%,100%{ transform: translate(0,0) scale(1); }
    33%    { transform: translate(60px,-40px) scale(1.15); }
    66%    { transform: translate(-50px,50px) scale(.9); }
  }
  .stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .stars span{
    position:absolute; width:3px; height:3px; background:#fff; border-radius:50%;
    opacity:.7; animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15; transform:scale(.6);} 50%{opacity:1; transform:scale(1.4);} }
  .card {
    position:relative; z-index:2;
    width:100%; max-width:440px;
    background:rgba(255,255,255,.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border:1px solid rgba(255,255,255,.28);
    border-radius:24px;
    padding:22px 20px 26px;
    color:#fff;
    box-shadow:0 25px 60px rgba(0,0,0,.55);
    animation: fadeUp .7s ease;
    max-height: 96vh;
    overflow-y:auto;
  }
  .card::-webkit-scrollbar{ width:6px; }
  .card::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.3); border-radius:10px; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
  h1 { text-align:center; font-size:1.3rem; margin-bottom:4px; letter-spacing:.5px; }
  .sub { text-align:center; font-size:.78rem; color:#cfd8e3; margin-bottom:16px; }
  .video-box{
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.2);
    border-radius:16px;
    padding:10px;
    margin-bottom:18px;
  }
  .video-box video{
    width:100%;
    border-radius:10px;
    display:block;
  }
  .sec-title{
    display:flex; align-items:center; gap:8px;
    font-size:.8rem; font-weight:700; letter-spacing:.5px;
    color:#dbe6f5; margin:16px 0 10px;
  }
  .sec-title::after{
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,.4), transparent);
  }
  .qris-box{
    background:#fff; border-radius:16px; padding:14px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(37,117,252,.6); }
    50%    { box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 10px rgba(37,117,252,0); }
  }
  .qris-box .logo { font-weight:800; color:#111; font-size:1rem; margin-bottom:8px; letter-spacing:1px;}
  .qris-box .logo span{ color:#e4002b; }
  .qris-box img{ width:100%; max-width:240px; display:block; margin:0 auto; border-radius:8px; }
  .qris-box .qris-note{ font-size:.72rem; color:#333; margin-top:8px; }
  .download-btn{
    margin-top:10px;
    background:#1db954;
    border:none;
    color:#fff;
    padding:10px 16px;
    border-radius:10px;
    font-size:.8rem;
    cursor:pointer;
    transition:.2s;
  }
  .download-btn:hover{ background:#17a84a; }
  .manual-item{
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16);
    border-radius:14px; padding:12px 14px; margin-bottom:10px;
    transition:.25s;
  }
  .manual-item:hover{ background:rgba(255,255,255,.18); transform:translateY(-2px); }
  .manual-item .label{ font-size:.7rem; color:#cfd8e3; }
  .manual-item .num{ font-size:.95rem; font-weight:700; letter-spacing:.5px; }
  .copy-btn{
    background:#2575fc; border:none; color:#fff;
    padding:7px 12px; border-radius:9px; font-size:.7rem; cursor:pointer; transition:.2s;
    flex-shrink:0;
  }
  .copy-btn:hover{ background:#1a5fd0; }
  .copy-btn.copied{ background:#1db954; }
  .toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px);
    background:#1db954; color:#fff; padding:10px 20px; border-radius:30px; font-size:.8rem;
    opacity:0; transition:.35s; z-index:99; pointer-events:none;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>
<div class="stars" id="stars"></div>
<div class="card">
  <h1>🏦 Pembayaran</h1>
  <p class="sub">payment By Xaveluxy</p>

  <div class="video-box">
    <video controls preload="none">
      <source src="https://cdn.videy.co/ZLxBOhDP1.mp4" type="video/mp4">
      Browser tidak mendukung video
    </video>
  </div>

  <div class="sec-title">Scan QRIS</div>
  <div class="qris-box">
    <div class="logo">QR<span>IS</span></div>
    <img id="qrisImg" src="https://files.catbox.moe/igt08l.jpg" alt="QRIS">
    <p class="qris-note">Scan pakai aplikasi e-wallet / m-banking</p>
    <button class="download-btn" id="downloadQris">Unduh QRIS</button>
  </div>

  <div class="sec-title">Transfer Manual</div>
  <div class="manual-item">
    <div>
      <div class="label">DANA</div>
      <div class="num">0856********</div>
    </div>
    <button class="copy-btn" data-copy="085696958343">Salin</button>
  </div>
  <div class="manual-item">
    <div>
      <div class="label">OVO</div>
      <div class="num">Blm tersedia</div>
    </div>
    <button class="copy-btn" data-copy="Off">Salin</button>
  </div>
  <div class="manual-item">
    <div>
      <div class="label">GOPAY</div>
      <div class="num">Blm tersedia</div>
    </div>
    <button class="copy-btn" data-copy="Off">Salin</button>
  </div>
</div>
<div class="toast" id="toast">Nomor berhasil disalin</div>

<script>
  const starsBox = document.getElementById('stars');
  for (let i=0; i<45; i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top  = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*3) + 's';
    s.style.animationDuration = (2 + Math.random()*3) + 's';
    starsBox.appendChild(s);
  }

  // Fungsi Unduh QRIS
  document.getElementById('downloadQris').addEventListener('click', async () => {
    const img = document.getElementById('qrisImg');
    try {
      const response = await fetch(img.src);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qris-pembayaran.jpg';
      a.click();
      URL.revokeObjectURL(url);
    } catch(err) {
      // Kalau blokir CORS: buka gambar baru lalu simpan manual
      window.open(img.src, '_blank');
      alert('Jika tidak terunduh: buka gambar lalu simpan ke galeri!');
    }
  });

  document.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const text = btn.dataset.copy;
      navigator.clipboard.writeText(text).then(()=>{
        btn.textContent = 'Tersalin';
        btn.classList.add('copied');
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(()=>{
          btn.textContent = 'Salin';
          btn.classList.remove('copied');
          toast.classList.remove('show');
        }, 1800);
      });
    });
  });
</script>
</body>
</html>
